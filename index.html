<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhishek | Frontend Engineer</title>
    <meta name="description" content="Developer portfolio of Abhishek, a frontend engineer with React, TypeScript, and Node.js experience." />

    <script>

        if (localStorage.getItem('portfolio-theme') === 'light') {

          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f4ec')
        }
      } catch {}
    </script>
